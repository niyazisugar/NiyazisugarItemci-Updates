name: Niyazisugar Itemci - Build and Publish

on:
  push:
    branches: [ main ]
    paths:
      - 'publish.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read publish manifest
        id: manifest
        shell: pwsh
        run: |
          $manifest = Get-Content publish.json -Raw | ConvertFrom-Json
          "version=$($manifest.version)" >> $env:GITHUB_OUTPUT
          $notes = ($manifest.notes -replace "`r", "" -replace "`n", " ")
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Extract source package
        shell: pwsh
        run: |
          if (-not (Test-Path "source-current.zip")) {
            throw "source-current.zip bulunamadi."
          }

          New-Item -ItemType Directory -Force -Path src | Out-Null
          Expand-Archive -Path "source-current.zip" -DestinationPath "src" -Force

          if (-not (Test-Path "src/app.ico") -and (Test-Path "src/app.ico.b64")) {
            $b64 = (Get-Content "src/app.ico.b64" -Raw).Trim()
            [IO.File]::WriteAllBytes("src/app.ico", [Convert]::FromBase64String($b64))
          }

          # Ana WinForms projesi varsayilan olarak alt klasordeki tum .cs dosyalarini da
          # derlemeye calisiyor. Updater'in Program.cs dosyasini ana EXE'ye dahil etmemek
          # icin updater projesini ana publish sirasinda src disina tasiyoruz.
          if (Test-Path "src/NiyazisugarUpdater") {
            Move-Item "src/NiyazisugarUpdater" "updater-src"
          }

          # Surum numarasini publish.json'dan kaynaklara uygula.
          # Boylece test/release surumlerinde kaynak ZIP'ini sirf versiyon icin
          # yeniden yuklemek gerekmiyor.
          $version = "${{ steps.manifest.outputs.version }}"

          $csproj = Get-Content "src/NiyazisugarItemci.csproj" -Raw
          $csproj = [regex]::Replace(
            $csproj,
            '<Version>[^<]+</Version>',
            "<Version>$version</Version>",
            1
          )
          Set-Content "src/NiyazisugarItemci.csproj" $csproj -Encoding utf8

          $updateService = Get-Content "src/UpdateService.cs" -Raw
          $updateService = [regex]::Replace(
            $updateService,
            'public const string CurrentVersion = "[^"]+";',
            "public const string CurrentVersion = `"$version`";",
            1
          )
          Set-Content "src/UpdateService.cs" $updateService -Encoding utf8

          $mainForm = Get-Content "src/MainForm.cs" -Raw
          $mainForm = [regex]::Replace(
            $mainForm,
            '_sidebarVersion\.Text = "2\.7\.0";',
            "_sidebarVersion.Text = `"$version`";"
          )
          $mainForm = [regex]::Replace(
            $mainForm,
            '_sidebarVersion\.Text = "Desktop V2\.7\.0";',
            "_sidebarVersion.Text = `"Desktop V$version`";"
          )
          Set-Content "src/MainForm.cs" $mainForm -Encoding utf8

      - name: Restore main app
        run: dotnet restore src/NiyazisugarItemci.csproj

      - name: Publish main app
        run: >-
          dotnet publish src/NiyazisugarItemci.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=false
          -o publish-main

      - name: Restore updater
        run: dotnet restore updater-src/NiyazisugarUpdater.csproj

      - name: Publish updater
        run: >-
          dotnet publish updater-src/NiyazisugarUpdater.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -o publish-updater

      - name: Assemble update package
        shell: pwsh
        run: |
          Copy-Item "publish-updater/NiyazisugarUpdater.exe" "publish-main/NiyazisugarUpdater.exe" -Force
          Compress-Archive -Path "publish-main/*" -DestinationPath "NiyazisugarItemci-update.zip" -Force

          $version = "${{ steps.manifest.outputs.version }}"
          $hash = (Get-FileHash "NiyazisugarItemci-update.zip" -Algorithm SHA256).Hash
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/v$version/NiyazisugarItemci-update.zip"

          $latest = [ordered]@{
            version = $version
            downloadUrl = $downloadUrl
            sha256 = $hash
            notes = "${{ steps.manifest.outputs.notes }}"
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
          }

          $latest | ConvertTo-Json -Depth 4 | Set-Content "latest.json" -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.manifest.outputs.version }}"
          $tag = "v$version"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Skipping duplicate publish."
            exit 0
          }

          gh release create $tag `
            "NiyazisugarItemci-update.zip" `
            "latest.json" `
            --target "${{ github.sha }}" `
            --title "Niyazisugar Itemci V$version" `
            --notes "${{ steps.manifest.outputs.notes }}" `
            --latest
